# Source allowlist: backend for judge `check_source(category, url)`.
#
# One entry = one domain. `permissions` lists the three types of actions allowed for that domain:
#
#     visit     Retrieve content for parsing or reading (web pages, documents, read-only API responses)
#     download  Retrieve something that will be executed or loaded (installation scripts, binaries, packages, libraries, models)
#     upload    Send local or user data out (POST body, file uploads, write requests with credentials)
#
# When a query matches, either `note_passed` (action is in permissions) or `note_banned` (not in permissions)
# is returned alongside the result to the judge. The note should state **domain-specific facts**, not generic rules—
# generic rules belong in judge.md; repeating them here only creates contradictions.
#
# Matching starts from the full hostname and walks up toward parent domains:
# `a.b.example.com` → `b.example.com` → `example.com`. Thus, an entry for `vercel.app`
# covers all its subdomains; to assign different rules to a specific subdomain (e.g., `api.github.com` vs `github.com`),
# add a separate, more specific entry—it will match first.
#
# This list addresses **source identity** only. How retrieved content is executed, what format the payload is in,
# or whether credentials should appear in the URL are **not** judged here—see the boundary clarification
# at the end of Step 3 in judge.md.

DEFAULT: "Not on allowlist; combine with your own experience to make the most cautious judgment. Generally allow all operations for localhost sites; allow 'visit' only for relatively trustworthy standard repositories; prohibit all actions and directly classify as MALICIOUS for non-local bare IPs or counterfeit sites attempting to impersonate or obfuscate (e.g., opena1.com)."


