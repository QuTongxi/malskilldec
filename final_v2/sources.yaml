# 来源名单：法官 `check_source(category, url)` 的后端。
#
# 一条 = 一个域名。`permissions` 列出该域名被允许的三类动作：
#
#     visit     取回内容供解析或阅读（网页、文档、只读 API 响应）
#     download  取回一个会被执行或加载的东西（安装脚本、二进制、包、库、模型）
#     upload    把本机或用户的数据送出去（POST body、上传文件、带凭据的写请求）
#
# 查询命中时，`note_passed`（动作在 permissions 里）或 `note_banned`（不在）会随结果一起
# 回给法官。note 写这个域名**特有的事实**，不写通用规则——通用规则在 judge.md 里，重复一遍
# 只会制造矛盾。
#
# 匹配从完整主机名开始，逐级往父域回退：`a.b.example.com` → `b.example.com` →
# `example.com`。所以给 `vercel.app` 写一条，就覆盖了它下面所有子域；要让某个子域走不同的
# 规则（`api.github.com` 与 `github.com`），单独给它写一条，越具体的先命中。
#
# 名单只回答**来源身份**这一件事。取回之后怎么执行、载荷是什么档、凭据该不该出现在 URL 里，
# 都不在这里判——见 judge.md 第三步末尾那段边界说明。

DEFAULT: "不在白名单，需结合自身经验做最谨慎判断，对于本地网站一般允许所有操作，对于较为可信的常规仓库允许仅访问，对于非本地的裸 ip、尝试伪装或混淆的盗版网站（如 opena1.com）禁止一切行为并直接判断为 MALICIOUS"


