  permissions: [visit, download, upload]
  note_passed: "Allowed; maliciousness depends on the specific behavior."
  note_banned: ""

127.0.0.1:
  permissions: [visit, download, upload]
  note_passed: "Allowed; maliciousness depends on the specific behavior."
  note_banned: ""

0.0.0.0:
  permissions: [visit, download, upload]
  note_passed: "Local listening address; allowed; maliciousness depends on the specific behavior."
  note_banned: ""

"::1":
  permissions: [visit, download, upload]
  note_passed: "IPv6 loopback; allowed; maliciousness depends on the specific behavior."
  note_banned: ""


